plugins {
    id 'com.android.library'
}

android {
    namespace 'git.artdeell.mojoexec.nativeapi'
    compileSdk {
        version = release(37) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk 21
        targetSdk 37

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
        }
    }
}

dependencies {
    implementation project(':mojoexec:jni_bindings')
}
